[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rangemap-tayra"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
keywords = []
authors = [
  { name = "Tayra Sakurai", email = "tayra_sakurai@icloud.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Tayra-Sakurai/rangemap-tayra#readme"
Issues = "https://github.com/Tayra-Sakurai/rangemap-tayra/issues"
Source = "https://github.com/Tayra-Sakurai/rangemap-tayra"

[tool.hatch.version]
path = "src/rangemap_tayra/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/rangemap_tayra tests}"

[tool.coverage.run]
source_pkgs = ["rangemap_tayra", "tests"]
branch = true
parallel = true
omit = [
  "src/rangemap_tayra/__about__.py",
]

[tool.coverage.paths]
rangemap_tayra = ["src/rangemap_tayra", "*/rangemap-tayra/src/rangemap_tayra"]
tests = ["tests", "*/rangemap-tayra/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
